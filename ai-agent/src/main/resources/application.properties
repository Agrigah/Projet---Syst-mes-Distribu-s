spring.application.name=ai-agent
server.port=8090

# --- OpenAI : la clé est lue dans la variable d'environnement OPENAI_API_KEY (jamais en clair !) ---
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-4o-mini
spring.ai.openai.chat.options.model=gpt-4o-mini

# --- Client MCP : connexion au serveur MCP (démarrer mcp-server AVANT ai-agent) ---
spring.ai.mcp.client.streamable-http.connections.ebank.url=http://localhost:8058
spring.ai.mcp.client.streamable-http.connections.ebank.endpoint=/mcp
spring.ai.mcp.client.request-timeout=60s

# --- Bots (optionnels : actifs uniquement si le token est défini) ---
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
discord.bot.token=${DISCORD_BOT_TOKEN:}
