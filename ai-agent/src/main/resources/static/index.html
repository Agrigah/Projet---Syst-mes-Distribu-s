<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Bank Assistant</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --text:#1c2333; --muted:#6b7385; --brand:#2f5bea; --user:#2f5bea; --bot:#eef1f8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10131c; --card:#181c28; --text:#e8ebf4; --muted:#8c94a8; --brand:#6d8cff; --user:#3b5bdb; --bot:#232839; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text);
         height:100vh; display:flex; justify-content:center; }
  .app { width:100%; max-width:760px; display:flex; flex-direction:column; height:100vh; padding:16px; gap:12px; }
  header { display:flex; align-items:center; gap:12px; }
  .logo { width:40px; height:40px; border-radius:12px; background:var(--brand); color:#fff; display:grid; place-items:center; font-weight:700; }
  h1 { font-size:18px; margin:0; } .sub { font-size:13px; color:var(--muted); }
  #chat { flex:1; overflow-y:auto; background:var(--card); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:16px; line-height:1.45; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--user); color:#fff; border-bottom-right-radius:4px; }
  .bot  { align-self:flex-start; background:var(--bot); border-bottom-left-radius:4px; }
  .typing { color:var(--muted); font-style:italic; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:1px solid var(--brand); color:var(--brand); background:transparent; padding:6px 12px; border-radius:999px; cursor:pointer; font-size:13px; }
  .chip:hover { background:var(--brand); color:#fff; }
  .bar { display:flex; gap:8px; }
  input { flex:1; padding:12px 14px; border-radius:12px; border:1px solid var(--muted); background:var(--card); color:var(--text); font-size:15px; }
  button.send { padding:0 20px; border:0; border-radius:12px; background:var(--brand); color:#fff; font-weight:600; cursor:pointer; }
  button.send:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">EB</div>
    <div><h1>E-Bank Assistant</h1><div class="sub">Agent IA · Spring AI + MCP · micro-services</div></div>
  </header>

  <div id="chat">
    <div class="msg bot">Bonjour ! Je suis l'assistant E-Bank. Je peux lister les clients, consulter leurs comptes ou créer un compte. Que puis-je faire pour vous ?</div>
  </div>

  <div class="chips">
    <button class="chip">Liste des clients</button>
    <button class="chip">Comptes du client 1</button>
    <button class="chip">Quel est le solde total du client 2 ?</button>
    <button class="chip">Crée un compte épargne de 5000 pour le client 3</button>
  </div>

  <div class="bar">
    <input id="q" placeholder="Posez votre question…" autocomplete="off">
    <button class="send" id="send">Envoyer</button>
  </div>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('q');
const sendBtn = document.getElementById('send');
const conversationId = 'web-' + Math.random().toString(36).slice(2);

function add(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

async function send(text) {
  text = (text || input.value).trim();
  if (!text) return;
  input.value = '';
  add(text, 'user');
  const wait = add('L’assistant réfléchit…', 'bot typing');
  sendBtn.disabled = true;
  try {
    const r = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: text, conversationId })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    wait.className = 'msg bot';
    wait.textContent = data.answer;
  } catch (e) {
    wait.className = 'msg bot';
    wait.textContent = 'Erreur : ' + e.message;
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener('click', () => send());
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => send(c.textContent)));
</script>
</body>
</html>
